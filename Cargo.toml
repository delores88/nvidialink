[workspace]
resolver = "3"
members = ["crates/sparkdev", "crates/sparkdev-link"]
default-members = ["crates/sparkdev"]
exclude = ["src-tauri"]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT"
publish = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
