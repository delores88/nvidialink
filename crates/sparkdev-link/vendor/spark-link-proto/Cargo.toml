[package]
name = "spark-link-proto"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
publish = false

[features]
default = []
io = ["dep:tokio"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
thiserror = "=2.0.21"
hmac = "=0.12.1"
sha2 = "=0.10.9"
hkdf = "=0.12.4"
base64 = "=0.22.1"
data-encoding = "=2.11.1"
getrandom = "=0.4.3"
zeroize = { version = "=1.9.1", features = ["derive"] }
bip39 = { version = "=2.2.0", default-features = false, features = ["std"] }
ed25519-dalek = { version = "=3.0.0", features = ["rand_core"] }
url = "=2.5.8"
tokio = { version = "=1.53.2", optional = true, features = ["io-util"] }

[dev-dependencies]
z32 = "=1.3.0"
tokio = { version = "=1.53.2", features = ["rt", "macros", "io-util", "net", "time"] }
