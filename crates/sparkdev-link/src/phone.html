<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Link Spark Dev Bridge</title>
<style nonce="NONCE_PLACEHOLDER">:root{color-scheme:dark}body{font:18px system-ui;background:#101624;color:#edf3fc;max-width:460px;margin:10vh auto;padding:24px}h1{font-size:30px}p{line-height:1.5;color:#c6d2e7}input,button{box-sizing:border-box;font:inherit;border-radius:12px;padding:16px;width:100%;margin:8px 0}input{border:1px solid #7586a3;background:#1a2539;color:white;letter-spacing:.3em;text-align:center}button{border:0;background:#b5ef70;color:#17280b;cursor:pointer}button.deny{background:#26324a;color:white}small{color:#b3bfd4}</style>
<h1>Link your computer</h1><p>Enter the six-digit code shown in Spark Dev Bridge on your laptop. Approve only a connection you started.</p><input id="code" aria-label="Six-digit approval code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off"><button id="approve">Approve link</button><button class="deny" id="deny">Deny</button><p id="result" role="status"></p><small>Your phone approves this connection. It does not receive access to your Spark.</small>
<script nonce="NONCE_PLACEHOLDER">(()=>{'use strict';const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);const result=document.getElementById('result');async function decide(choice){const code=document.getElementById('code').value;if(choice==='approve'&&!/^[0-9]{6}$/.test(code)){result.textContent='Enter the six digits shown on your laptop.';return;}try{const r=await fetch(location.pathname+'/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,choice,verification_code:code}),cache:'no-store',credentials:'omit'});if(!r.ok)throw new Error();const data=await r.json();document.getElementById('approve').disabled=true;document.getElementById('deny').disabled=true;document.getElementById('code').value='';result.textContent=data.outcome==='approved'?'Approved. Return to your laptop to confirm the link.':'Connection denied.';}catch(_){result.textContent='Approval failed. Check the laptop code or create a fresh QR code.';}}document.getElementById('approve').onclick=()=>decide('approve');document.getElementById('deny').onclick=()=>decide('deny');if(!token){result.textContent='This link is incomplete. Scan a fresh QR code from your laptop.';document.getElementById('approve').disabled=true;}})();</script></html>
