[package]
name = "sparkdev-link"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
publish = false

[dependencies]
anyhow = "=1.0.104"
iroh = "=1.3.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
tokio = { version = "=1.53.2", features = ["full"] }
spark-link-proto = { path = "vendor/spark-link-proto", features = ["io"] }
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
base64 = "=0.22.1"
sha2 = "=0.10.9"
zeroize = "=1.9.1"
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Registry"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[dev-dependencies]
tempfile = "=3.27.0"
