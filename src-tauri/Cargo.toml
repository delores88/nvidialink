[package]
name = "dgxbridge"
version = "0.4.1"
edition = "2024"
license = "MIT"
description = "DGXBridge desktop connection and job board"
authors = ["DeloresAI"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
tokio = { version = "=1.53.2", features = ["process", "time", "io-util", "sync", "fs", "macros", "rt-multi-thread"] }
sparkdev = { path = "../crates/sparkdev" }
base64 = "=0.22.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "=0.10.9"
ed25519-dalek = "=2.2.0"
chrono = { version = "=0.4.45", features = ["serde"] }
semver = "=1.0.28"
url = "=2.5.8"
zeroize = "=1.9.1"
getrandom = "=0.3.4"
quick-xml = "=0.42.0"
# The October 2026 advisory fixes are required by the Marketplace scanner.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
tempfile = "=3.27.0"

[workspace]
