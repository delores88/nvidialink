[package]
name = "spark-dev-bridge"
version = "0.1.0-beta.1"
edition = "2024"
license = "MIT"
description = "Spark Dev Bridge desktop connection and job board"
authors = ["DeloresAI"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
tokio = { version = "=1.53.2", features = ["process", "time", "io-util", "sync"] }
sparkdev = { path = "../crates/sparkdev" }
base64 = "=0.22.1"

[workspace]
